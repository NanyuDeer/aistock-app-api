# 持续集成门禁：类型检查（tsc --noEmit）+ 测试（node:test）
#
# 目的：防止「检查 / 测试」欠账再次累积。
# 背景：2026-10 之前本仓没有任何 CI，类型检查与测试长期无人把关，累积了 14 条失败测试
#（模块化重构后遗留的过期导入路径、过期断言、以及依赖外部服务的非 hermetic 用例），
# 并因此掩盖了多处真实缺口。本轮已全部清零（1009 条测试全绿），
# 任何**新增**失败都会在这里被拦下，不会再悄悄堆积。
#
# 说明：
# - 本仓**没有 lint 工具**（package.json 无 lint 脚本，仓库内无任何 ESLint 配置与依赖），
#   因此不设 lint 步骤；代码层面的检查由 `tsc --noEmit`（tsconfig strict: true）承担。
# - 包管理器以 pnpm-lock.yaml 为准；`--frozen-lockfile` 严格按锁文件安装，
#   顺带拦住「改了依赖忘提交 lock」。
# - 测试命令与 package.json 的 `test` 脚本完全一致（node:test + tsx runner）；
#   用例均为「无凭据、无外部服务、无 DB/Redis」的 hermetic 用例，可在 CI 稳定运行。
# - Node 版本取 22：本仓无 engines / .nvmrc / Dockerfile，取同组织 aistock-frontend
#   的 .github/workflows/release.yml 既有约定（node-version: '22'）。

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    name: 类型检查与测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm（版本取自 package.json 的 packageManager）
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # --frozen-lockfile：严格按 pnpm-lock.yaml 安装；与 package.json 不一致时直接失败
      - name: 同步依赖
        run: pnpm install --frozen-lockfile

      - name: TypeScript 类型检查（strict）
        run: npx tsc --noEmit

      - name: 运行测试
        run: pnpm test
